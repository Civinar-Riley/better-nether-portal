# 推送 / PR 时：构建并跑 GameTest，保证发版前测试一直是绿的。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        # 用 bash 显式调用，避免仓库里 gradlew 缺可执行权限位时 Permission denied
        run: bash ./gradlew build --no-daemon

      - name: GameTest
        # GameTestServer 偶发区块加载卡死（永不退出），用超时兜底，避免占满 Actions 时长
        timeout-minutes: 15
        run: bash ./gradlew runGameTestServer --no-daemon
